name: Deploy CDLP Shared Data Admin

on:
  push:
    branches: [main]
    paths:
      - 'cdlp-shared-data-admin/**'
      - '.github/workflows/cdlp-shared-data-admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdlp-shared-data-admin
    env:
      VITE_SUPABASE_URL: https://syflloyjgndwnttwfnvl.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_X4UUCax2m8DYSIaK1nU_5Q_Mvd3Typf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cdlp-shared-data-admin/package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cdlp-shared-data-admin/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
